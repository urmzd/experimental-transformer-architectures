[project]
name = "glassbox-lm"
version = "0.1.0"
description = "A language model where each register is a word"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "glassbox-lm-cli",
]

# Virtual workspace root: `uv sync` installs the CLI app (and, transitively,
# every lib) as editable workspace members. Not itself an installable package.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "apps/*"]

[tool.uv.sources]
glassbox-lm-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# E701/E702 (one-line compound statements) and E741 (short loop names) are
# existing house style throughout the training and observe code.
ignore = ["E701", "E702", "E741"]
