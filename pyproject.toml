[project]
name = "glassbox-lm"
version = "0.1.0"
description = "A language model where each register is a word"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "sentencepiece",
    "huggingface_hub",
    "pydantic>=2",
    "pydantic-settings>=2.13.1",
    "torch>=2.4",
]

[project.scripts]
setup-data = "data.download_data:main"
benchmark = "apps.cli.benchmark:main"
observe = "apps.cli.observe:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["data", "core", "apps", "apps.*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# E701/E702 (one-line compound statements) and E741 (short loop names) are
# existing house style throughout the training and observe code.
ignore = ["E701", "E702", "E741"]
